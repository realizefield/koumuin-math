<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KQU10 演習　a≠1の平方完成</title>
<style>
:root{
  --primary:#0f766e;--primary-d:#0d5c56;--primary-l:#f0fdfa;
  --hint:#f59e0b;--hint-bg:#fffbeb;--warn:#dc2626;
  --bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --green:#059669;--green-l:#f0fdf4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'BIZ UDPGothic','BIZ UDP Gothic',-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.8;font-size:15px;overflow-x:hidden}
header{position:sticky;top:0;background:var(--primary);color:#fff;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:10}
header h1{margin:0;font-size:1.05em;font-weight:700}
header .sub{font-size:.78em;opacity:.88;margin-top:2px}
.steps{display:flex;background:#fff;border-bottom:1px solid var(--border)}
.step{flex:1;text-align:center;padding:8px 4px;font-size:.78em;font-weight:700;color:var(--muted);border-bottom:3px solid var(--border)}
.step.active{color:var(--primary);border-color:var(--primary)}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
/* セットセレクター */
.set-selector{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.set-btn{padding:8px 18px;border:2px solid var(--border);border-radius:8px;background:#fff;font-weight:700;cursor:pointer;font-size:.9em;color:var(--muted);transition:.15s}
.set-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
.set-desc{font-size:.82em;color:var(--muted);margin-bottom:14px;padding:6px 10px;background:#f8fafc;border-radius:6px;border-left:3px solid var(--primary)}
/* 問題カード */
.drill-card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.q-num{font-size:.82em;font-weight:700;color:var(--muted);margin-bottom:6px}
.q-text{font-size:1.02em;font-weight:700;color:var(--text);margin-bottom:12px;line-height:1.7}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{padding:11px 10px;border:2px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:.92em;text-align:center;transition:.15s;font-weight:500;line-height:1.5}
.choice:hover{border-color:var(--primary);background:var(--primary-l)}
.choice.selected{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d)}
.choice.correct{border-color:var(--green);background:var(--green-l);color:#065f46;font-weight:700}
.choice.wrong{border-color:var(--warn);background:#fef2f2;color:var(--warn);font-weight:700}
/* フィードバック（詳しい解説） */
.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.9em;line-height:2.1}
.feedback.show{display:block}
.feedback.ok-fb{background:var(--green-l);border-left:4px solid var(--green);color:#065f46}
.feedback.ng-fb{background:#fef2f2;border-left:4px solid var(--warn);color:#991b1b}
.fb-steps{margin-top:8px;background:#fff;border-radius:8px;padding:10px 12px;border:1px solid var(--border);font-size:.93em;line-height:2.3;color:var(--text)}
.fb-key{background:#fef9c3;border-radius:3px;padding:0 3px;color:#92400e;font-weight:700}
/* 採点 */
.submit-row{text-align:center;margin:20px 0 8px}
.btn-submit{background:var(--primary);color:#fff;border:none;padding:13px 40px;border-radius:10px;font-size:1em;font-weight:700;cursor:pointer;transition:.15s}
.btn-submit:hover{background:var(--primary-d)}
.btn-submit:disabled{background:#94a3b8;cursor:default}
/* 結果 */
.result-box{display:none;margin:16px 0;padding:20px;border-radius:12px;text-align:center;border:2px solid var(--border)}
.result-box.show{display:block}
.result-box.passed{border-color:var(--green);background:var(--green-l)}
.result-box.failed{border-color:var(--hint);background:var(--hint-bg)}
.result-msg{font-size:1.2em;font-weight:700;margin-bottom:6px}
.result-score{font-size:2.2em;font-weight:700;color:var(--primary);margin:6px 0}
.result-detail{font-size:.9em;color:var(--muted)}
/* ナビ */
.nav{display:flex;gap:10px;margin-top:20px}
.btn{display:block;padding:12px 16px;border-radius:10px;text-decoration:none;text-align:center;font-weight:700;font-size:.95em;flex:1}
.btn-back{background:#f1f5f9;color:var(--muted)}
.btn-next{background:var(--primary);color:#fff}
/* 花吹雪 */
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;animation:confetti-fall 2.5s ease-in forwards;pointer-events:none;z-index:9999}
</style>
</head>
<body>

<header>
  <h1>KQU10　演習　a≠1 の平方完成</h1>
  <div class="sub">x²の係数が1以外のときの平方完成をマスターしよう</div>
</header>

<div class="steps">
  <div class="step"><a href="./KQU10_intro_v5.html" style="color:inherit;text-decoration:none">① 解説</a></div>
  <div class="step active">② 演習</div>
  <div class="step"><a href="./KQU10_check.html" style="color:inherit;text-decoration:none">③ 確認</a></div>

<div class="wrap">

<div class="set-selector">
  <button class="set-btn active" onclick="loadSet(0)">セットA</button>
  <button class="set-btn" onclick="loadSet(1)">セットB</button>
  <button class="set-btn" onclick="loadSet(2)">セットC</button>
  <button class="set-btn" onclick="loadSet(3)">セットD</button>
</div>
<div class="set-desc" id="set-desc"></div>

<div id="quiz-area"></div>

<div class="submit-row">
  <button class="btn-submit" id="btn-submit" onclick="grade()">採点する</button>
</div>

<div class="result-box" id="result">
  <div class="result-msg" id="result-msg"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-detail" id="result-detail"></div>
</div>

<div class="nav">
  <a href="./KQU10_intro_v5.html" class="btn btn-back">← 解説へ戻る</a>
  <a href="./KQU10_check.html" class="btn btn-next">確認テストへ →</a>
</div>

</div>

<script>
const SET_DESC = [
  'セットA ── a が正の数（2・3・4）の平方完成',
  'セットB ── a が負の数（－1・－2・－3）の平方完成',
  'セットC ── 分数が出る問題（公務員試験レベル）',
  'セットD ── 総合問題（すべてのパターン混合）',
];

const SETS = [
  // ══ セットA：a が正の場合 ══
  [
    {
      q: 'y＝2x²－8x＋3 を平方完成した式はどれか？',

        '② カッコの中を平方完成：x の係数 −4 の半分＝−2、(−2)²＝4',
        '　　y＝2{(x－2)²－4}＋3',
        '③ 2 を分配する：<span class="fb-key">2×(−4)＝−8</span>',

        '　　y＝3{(x＋2)²－4}＋5',
        '③ 3 を分配する：<span class="fb-key">3×(−4)＝−12</span>',

      ans: 0,
      exp: '正解は <b>(1, −1)</b>',
      steps: [
        '① 4 でくくり出す：y＝4(x²－2x)＋3',
        '② カッコの中を平方完成：−2 の半分＝−1、(−1)²＝1',
        '　　y＝4{(x－1)²－1}＋3',
        '③ 4 を分配する：<span class="fb-key">4×(−1)＝−4</span>',
        '　　y＝4(x－1)²－4＋3＝4(x－1)²－1',

      ans: 0,
      exp: '正解は <b>y＝2(x＋2)²－7</b>',
      steps: [
        '① 2 でくくり出す：y＝2(x²＋4x)＋1',
        '② カッコの中を平方完成：+4 の半分＝2、2²＝4',

        '③ 2 を分配する：<span class="fb-key">2×(−4)＝−8</span>',
        '　　y＝2(x＋2)²－8＋1＝2(x＋2)²－7',
        '→ 頂点は (−2, −7)'
      ]
    },
  ],

  // ══ セットB：a が負の場合 ══
  [
    {
      q: 'y＝－2x²＋4x＋3 の頂点の座標はどれか？',
      choices: ['(1, 5)', '(−1, 5)', '(1, −5)', '(−1, −5)'],
      ans: 0,
      exp: '正解は <b>(1, 5)</b>',
      steps: [
        '① −2 でくくり出す：y＝−2(x²－2x)＋3',

        '　　y＝−2(x－1)²＋2＋3＝−2(x－1)²＋5',

    },

      q: 'y＝－x²＋6x－5 の頂点の座標はどれか？',

      ans: 0,
      exp: '正解は <b>(3, 4)</b>',

        '① −1 でくくり出す：y＝−(x²－6x)－5',

    },
    {
      q: 'y＝－3x²＋12x－8 を平方完成した式はどれか？',
      choices: ['y＝－3(x－2)²＋4', 'y＝－3(x＋2)²＋4', 'y＝－3(x－2)²－4', 'y＝3(x－2)²＋4'],

      exp: '正解は <b>y＝－3(x－2)²＋4</b>',

        '③ −3 を分配する：<span class="fb-key">−3×(−4)＝＋12</span>',
        '　　y＝−3(x－2)²＋12－8＝−3(x－2)²＋4',
        '→ 頂点は (2, 4)　a＜0 なので最大値'
      ]
    },
    {
      q: 'y＝－2x²－8x＋1 の最大値はどれか？',
      choices: ['9', '−7', '1', '−9'],
      ans: 0,
      exp: '正解は <b>9</b>（頂点の y 座標）',
      steps: [
        '① −2 でくくり出す：y＝−2(x²＋4x)＋1',
        '② カッコの中を平方完成：+4 の半分＝2、2²＝4',
        '　　y＝−2{(x＋2)²－4}＋1',
        '③ −2 を分配する：<span class="fb-key">−2×(−4)＝＋8</span>',
        '　　y＝−2(x＋2)²＋8＋1＝−2(x＋2)²＋9',
        '→ 頂点は (−2, 9)　a＜0 なので最大値は <b>9</b>'
      ]
    },
  ],

  // ══ セットC：分数が出る問題 ══
  [
    {
      q: 'y＝2x²－6x＋1 の頂点の x 座標はどれか？',
      choices: ['3/2', '－3/2', '3', '－3'],
      ans: 0,
      exp: '正解は <b>x＝3/2</b>',
      steps: [
        '① 2 でくくり出す：y＝2(x²－3x)＋1',
        '② x の係数 −3 の半分＝<span class="fb-key">−3/2</span>、(3/2)²＝9/4',
        '　　y＝2{(x－3/2)²－9/4}＋1',
        '③ 2 を分配：2×(−9/4)＝<span class="fb-key">−9/2</span>',
        '　　y＝2(x－3/2)²－9/2＋1＝2(x－3/2)²－7/2',
        '→ 頂点の x 座標は <b>3/2</b>'
      ]
    },
    {
      q: 'y＝4x²－6x＋2 の頂点の座標はどれか？',
      choices: ['(3/4, −1/4)', '(−3/4, −1/4)', '(3/4, 1/4)', '(3/2, −1/4)'],
      ans: 0,
      exp: '正解は <b>(3/4, −1/4)</b>',
      steps: [
        '① 4 でくくり出す：y＝4(x²－3/2・x)＋2',
        '② x の係数 −3/2 の半分＝<span class="fb-key">−3/4</span>、(3/4)²＝9/16',
        '　　y＝4{(x－3/4)²－9/16}＋2',
        '③ 4 を分配：4×(−9/16)＝<span class="fb-key">−9/4</span>',
        '　　y＝4(x－3/4)²－9/4＋2＝4(x－3/4)²－1/4',
        '→ 頂点は (3/4, −1/4)'
      ]
    },
    {
      q: 'y＝2x²－3x＋1 の頂点の y 座標はどれか？',
      choices: ['－1/8', '1/8', '－1/4', '1/4'],
      ans: 0,
      exp: '正解は <b>−1/8</b>',
      steps: [
        '① 2 でくくり出す：y＝2(x²－3/2・x)＋1',
        '② x の係数 −3/2 の半分＝<span class="fb-key">−3/4</span>、(3/4)²＝9/16',
        '　　y＝2{(x－3/4)²－9/16}＋1',
        '③ 2 を分配：2×(−9/16)＝<span class="fb-key">−9/8</span>',
        '　　y＝2(x－3/4)²－9/8＋1＝2(x－3/4)²－1/8',
        '→ 頂点の y 座標は <b>−1/8</b>'
      ]
    },
    {
      q: 'y＝－2x²＋5x－1 の頂点の座標はどれか？',
      choices: ['(5/4, 17/8)', '(−5/4, 17/8)', '(5/4, −17/8)', '(5/2, 17/8)'],
      ans: 0,
      exp: '正解は <b>(5/4, 17/8)</b>',
      steps: [
        '① −2 でくくり出す：y＝−2(x²－5/2・x)－1',
        '② x の係数 −5/2 の半分＝<span class="fb-key">−5/4</span>、(5/4)²＝25/16',
        '　　y＝−2{(x－5/4)²－25/16}－1',
        '③ −2 を分配：<span class="fb-key">−2×(−25/16)＝＋25/8</span>',
        '　　y＝−2(x－5/4)²＋25/8－1＝−2(x－5/4)²＋17/8',

  // ══ セットD：総合問題 ══
  [
    {
      q: 'y＝3x²＋6x＋5 の頂点の座標はどれか？',
      choices: ['(−1, 2)', '(1, 2)', '(−1, −2)', '(1, −2)'],
      ans: 0,
      exp: '正解は <b>(−1, 2)</b>',

    },
  ],
];

let currentSet = 0;

function loadSet(idx){
  currentSet = idx;
  document.querySelectorAll('.set-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('set-desc').textContent = SET_DESC[idx];
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('btn-submit').textContent = '採点する';
  document.getElementById('result').className = 'result-box';
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';
  SETS[idx].forEach((q,i)=>{
    const card = document.createElement('div');
    card.className = 'drill-card';
    card.dataset.q = i;
    card.innerHTML = `
      <div class="q-num">問 ${i+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="choices">
        ${q.choices.map((c,j)=>`<button class="choice" data-i="${j}" onclick="pick(this,${i})">${c}</button>`).join('')}
      </div>
      <div class="feedback" id="fb-${i}"></div>
    `;
    area.appendChild(card);
  });
}

function pick(btn, qIdx){
  const card = btn.closest('.drill-card');
  if(card.dataset.chosen) return;
  card.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  card.dataset.chosen = btn.dataset.i;
}

function grade(){
  const qs = SETS[currentSet];
  let correct = 0;
  let allAnswered = true;
  qs.forEach((q,i)=>{
    const card = document.querySelector(`.drill-card[data-q="${i}"]`);
    const chosen = card.dataset.chosen;
    if(!chosen){ allAnswered = false; alert(`問${i+1}がまだ選択されていません`); return; }
    const isOK = parseInt(chosen)===q.ans;
    if(isOK) correct++;
    card.querySelectorAll('.choice').forEach(b=>{
      b.disabled = true;
      if(parseInt(b.dataset.i)===q.ans) b.classList.add('correct');
      if(parseInt(b.dataset.i)===parseInt(chosen)&&!isOK) b.classList.add('wrong');
    });
    const fb = document.getElementById(`fb-${i}`);
    const stepsHtml = q.steps.map(s=>`<div>${s}</div>`).join('');
    fb.innerHTML = `${q.exp}<div class="fb-steps">${stepsHtml}</div>`;
    fb.className = 'feedback show ' + (isOK ? 'ok-fb' : 'ng-fb');
  });
  if(!allAnswered) return;
  const result = document.getElementById('result');
  const passed = correct === qs.length;
  result.className = 'result-box show ' + (passed ? 'passed' : 'failed');
  document.getElementById('result-msg').textContent = passed ? '🎉 全問正解！' : 'もう一度確認しましょう';
  document.getElementById('result-score').textContent = `${correct} / ${qs.length}`;
  document.getElementById('result-detail').textContent = passed
    ? '解説を読んで次のセットや確認テストに進もう！'
    : '解説をよく読んで、別のセットにも挑戦してみよう。';
  if(passed) confetti();
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('btn-submit').textContent = '採点済み';
}

function confetti(){
  const colors=['#0f766e','#f59e0b','#059669','#0284c7','#4f46e5'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;background:${colors[i%5]};animation-delay:${Math.random()*1.2}s;animation-duration:${2+Math.random()}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}

loadSet(0);
</script>
