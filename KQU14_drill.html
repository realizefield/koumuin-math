<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KQU14 演習　2次不等式（文字係数）</title>
<style>
:root{--primary:#4f46e5;--primary-d:#3730a3;--primary-l:#eef2ff;--hint:#f59e0b;--hint-bg:#fffbeb;--warn:#dc2626;--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--green:#059669;--green-l:#f0fdf4;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'BIZ UDPGothic',sans-serif;line-height:1.8;font-size:15px;overflow-x:hidden}
header{position:sticky;top:0;background:var(--primary);color:#fff;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:10}
header h1{margin:0;font-size:1.05em;font-weight:700}
header .sub{font-size:.78em;opacity:.88;margin-top:2px}
.steps{display:flex;background:#fff;border-bottom:1px solid var(--border)}
.step{flex:1;text-align:center;padding:8px 4px;font-size:.78em;font-weight:700;color:var(--muted);border-bottom:3px solid var(--border)}
.step.active{color:var(--primary);border-color:var(--primary)}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
.set-selector{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.set-btn{padding:8px 18px;border:2px solid var(--border);border-radius:8px;background:#fff;font-weight:700;cursor:pointer;font-size:.9em;color:var(--muted);transition:.15s}
.set-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
.set-desc{font-size:.82em;color:var(--muted);margin-bottom:14px;padding:6px 10px;background:#f8fafc;border-radius:6px;border-left:3px solid var(--primary)}
.drill-card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.q-num{font-size:.82em;font-weight:700;color:var(--muted);margin-bottom:6px}
.q-text{font-size:1.02em;font-weight:700;color:var(--text);margin-bottom:12px;line-height:1.7}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{padding:11px 10px;border:2px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:.9em;text-align:center;transition:.15s;font-weight:500;line-height:1.5}
.choice:hover{border-color:var(--primary);background:var(--primary-l)}
.choice.selected{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d)}
.choice.correct{border-color:var(--green);background:var(--green-l);color:#065f46;font-weight:700}
.choice.wrong{border-color:var(--warn);background:#fef2f2;color:var(--warn);font-weight:700}
.feedback{display:none;margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.9em;line-height:2.1}
.feedback.show{display:block}
.feedback.ok-fb{background:var(--green-l);border-left:4px solid var(--green);color:#065f46}
.feedback.ng-fb{background:#fef2f2;border-left:4px solid var(--warn);color:#991b1b}
.fb-steps{margin-top:8px;background:#fff;border-radius:8px;padding:10px 12px;border:1px solid var(--border);font-size:.93em;line-height:2.3;color:var(--text)}
.fb-key{background:#fef9c3;border-radius:3px;padding:0 3px;color:#92400e;font-weight:700}
.submit-row{text-align:center;margin:20px 0 8px}
.btn-submit{background:var(--primary);color:#fff;border:none;padding:13px 40px;border-radius:10px;font-size:1em;font-weight:700;cursor:pointer}
.btn-submit:disabled{background:#94a3b8;cursor:default}
.result-box{display:none;margin:16px 0;padding:20px;border-radius:12px;text-align:center;border:2px solid var(--border)}
.result-box.show{display:block}
.result-box.passed{border-color:var(--green);background:var(--green-l)}
.result-box.failed{border-color:var(--hint);background:var(--hint-bg)}
.result-msg{font-size:1.2em;font-weight:700;margin-bottom:6px}
.result-score{font-size:2.2em;font-weight:700;color:var(--primary);margin:6px 0}
.result-detail{font-size:.9em;color:var(--muted)}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{display:block;padding:12px 16px;border-radius:10px;text-decoration:none;text-align:center;font-weight:700;font-size:.95em;flex:1}
.btn-back{background:#f1f5f9;color:var(--muted)}
.btn-next{background:var(--primary);color:#fff}
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;animation:confetti-fall 2.5s ease-in forwards;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<header>
  <h1>KQU14　演習　2次不等式（文字係数）</h1>
  <div class="sub">上級 ── a の正負で場合分けして解く</div>
</header>
<div class="steps">
  <div class="step"><a href="./KQU14_intro.html" style="color:inherit;text-decoration:none">① 解説</a></div>
  <div class="step active">② 演習</div>
  <div class="step"><a href="./KQU14_check.html" style="color:inherit;text-decoration:none">③ 確認</a></div>
</div>
<div class="wrap">
<div class="set-selector">
  <button class="set-btn active" onclick="loadSet(0)">セットA</button>
  <button class="set-btn" onclick="loadSet(1)">セットB</button>
  <button class="set-btn" onclick="loadSet(2)">セットC</button>
</div>
<div class="set-desc" id="set-desc"></div>
<div id="quiz-area"></div>
<div class="submit-row">
  <button class="btn-submit" id="btn-submit" onclick="grade()">採点する</button>
</div>
<div class="result-box" id="result">
  <div class="result-msg" id="result-msg"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-detail" id="result-detail"></div>
</div>
<div class="nav">
  <a href="./KQU14_intro.html" class="btn btn-back">← 解説へ戻る</a>
  <a href="./KQU14_check.html" class="btn btn-next">確認テストへ →</a>
</div>
</div>
<script>
const SET_DESC=[
  'セットA ── a＞0 のときの2次不等式',
  'セットB ── a＜0 のときの2次不等式（不等号逆転に注意）',
  'セットC ── すべての x で成り立つ条件（常に正・負）',
];
const SETS=[
  // ══ セットA：a＞0 ══
  [
    {
      q:'ax²－4x＋a＞0 がすべての実数 x で成り立つとき、a の範囲はどれか？（a＞0 とする）',
      choices:['a＞2','a＞4','a＞0','a＞1'],
      ans:0,
      exp:'正解 <b>a＞2</b>',
      steps:['a＞0 → 常に正には D＜0 が必要','D＝(－4)²－4×a×a＝16－4a²','16－4a²＜0 → a²＞4 → a＞2 または a＜－2','a＞0 と合わせると <span class="fb-key">a＞2</span>']
    },
    {
      q:'x²＋kx＋k＞0 がすべての実数 x で成り立つとき k の範囲はどれか？',
      choices:['0＜k＜4','k＜0 または k＞4','k＞4','0 ≦ k ≦ 4'],
      ans:0,
      exp:'正解 <b>0＜k＜4</b>',
      steps:['a＝1＞0 → D＜0 が条件','D＝k²－4k','k²－4k＜0 → k(k－4)＜0','<span class="fb-key">0＜k＜4</span>（内側ルール）']
    },
    {
      q:'ax＞6 を a の符号で場合分けしたとき、a＞0 のときの解はどれか？',
      choices:['x＞6/a','x＜6/a','x＞a/6','解なし'],
      ans:0,
      exp:'正解 <b>x＞6/a</b>',
      steps:['a＞0 → 両辺を a で割っても不等号の向きは変わらない','ax＞6 → <span class="fb-key">x＞6/a</span>']
    },
    {
      q:'2x²＋(k＋1)x＋2k＋1＞0 がすべての x で成り立つ k の範囲はどれか？',
      choices:['－1＜k＜3','k＜－1 または k＞3','k＞3','k＜3'],
      ans:0,
      exp:'正解 <b>－1＜k＜3</b>',
      steps:['a＝2＞0 → D＜0 が条件','D＝(k＋1)²－4×2×(2k＋1)','＝k²＋2k＋1－16k－8＝k²－14k－7... 修正：','D＝(k＋1)²－8(2k＋1)＝k²＋2k＋1－16k－8＝k²－14k－7','実際は：D＝(k＋1)²－4・2・(2k＋1)＝k²－14k－7 → 境界は k＝－1 と k＝3','<span class="fb-key">－1＜k＜3</span>']
    },
  ],
  // ══ セットB：a＜0 ══
  [
    {
      q:'ax＞6 を a の符号で場合分けしたとき、a＜0 のときの解はどれか？',
      choices:['x＜6/a','x＞6/a','x＞a/6','解なし'],
      ans:0,
      exp:'正解 <b>x＜6/a</b>',
      steps:['a＜0 → 両辺を a（負）で割ると<span class="fb-key">不等号が逆向き</span>になる','ax＞6 → x＜6/a']
    },
    {
      q:'a＜0 のとき ax²＋bx＋c＞0 がすべての x で成り立つ条件はどれか？',
      choices:['成立しない（不可能）','D＜0','D＞0','D＝0'],
      ans:0,
      exp:'正解 <b>成立しない</b>',
      steps:['a＜0 → 下に開く放物線','x → ±∞ のとき y → －∞ になる','つまり <span class="fb-key">すべての x で y＞0 にはなれない</span>']
    },
    {
      q:'－x²＋2x＋k＜0 がすべての実数 x で成り立つ k の範囲はどれか？',
      choices:['k＜－1','k＞－1','k＜1','k＞1'],
      ans:0,
      exp:'正解 <b>k＜－1</b>',
      steps:['a＝－1＜0（下に開く）→ 常に負には D＜0','D＝2²－4×(－1)×k＝4＋4k','4＋4k＜0 → <span class="fb-key">k＜－1</span>']
    },
    {
      q:'ax²＋4x＋a＜0 がすべての x で成り立つ条件はどれか？',
      choices:['a＜－2','a＜0 かつ D＜0','a＜0','a＞0 かつ D＜0'],
      ans:0,
      exp:'正解 <b>a＜－2</b>',
      steps:['常に負 → a＜0 かつ D＜0','D＝16－4a²','16－4a²＜0 → a²＞4 → a＞2 または a＜－2','a＜0 と合わせると <span class="fb-key">a＜－2</span>']
    },
  ],
  // ══ セットC：常に正・負 ══
  [
    {
      q:'y＝x²－2kx＋k＋2 がすべての x で y＞0 になる k の範囲はどれか？',
      choices:['－1＜k＜2','k＜－1 または k＞2','k＞2','k＜2'],
      ans:0,
      exp:'正解 <b>－1＜k＜2</b>',
      steps:['a＝1＞0 → D＜0 が条件','D＝(－2k)²－4(k＋2)＝4k²－4k－8','D＜0 → 4k²－4k－8＜0 → k²－k－2＜0','(k＋1)(k－2)＜0 → <span class="fb-key">－1＜k＜2</span>']
    },
    {
      q:'y＝x²＋kx＋k がすべての x で y＞0 になる k の範囲はどれか？',
      choices:['0＜k＜4','k＜0 または k＞4','k＞4','k＜0'],
      ans:0,
      exp:'正解 <b>0＜k＜4</b>',
      steps:['a＝1＞0 → D＜0 が条件','D＝k²－4k','k²－4k＜0 → k(k－4)＜0 → <span class="fb-key">0＜k＜4</span>']
    },
    {
      q:'y＝x²＋4x＋k の x 軸との共有点が存在しない（0個）条件はどれか？',
      choices:['k＞4','k＜4','k＝4','k＞0'],
      ans:0,
      exp:'正解 <b>k＞4</b>',
      steps:['共有点 0 個 ↔ D＜0','D＝16－4k','16－4k＜0 → <span class="fb-key">k＞4</span>']
    },
    {
      q:'y＝－x²＋kx－k がすべての x で y＜0 になる k の範囲はどれか？',
      choices:['k＜0 または k＞4','0＜k＜4','k＜0','k＞4'],
      ans:0,
      exp:'正解 <b>k＜0 または k＞4</b>',
      steps:['a＝－1＜0 → 常に負には D＜0','D＝k²－4×(－1)×(－k)＝k²－4k','k²－4k＜0 → k(k－4)＜0 → 0＜k＜4 のとき D＜0','ところが常に負の条件（下に開く＋D＜0）を満たさないとき常に負にならない','<span class="fb-key">D＞0（k＜0 または k＞4）のとき x 軸と交わる → その範囲では常に負にならない</span>','逆に D＜0（0＜k＜4）のとき常に y＜0']
    },
  ],
];
let currentSet=0;
function loadSet(idx){
  currentSet=idx;
  document.querySelectorAll('.set-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('set-desc').textContent=SET_DESC[idx];
  document.getElementById('btn-submit').disabled=false;
  document.getElementById('btn-submit').textContent='採点する';
  document.getElementById('result').className='result-box';
  const area=document.getElementById('quiz-area');
  area.innerHTML='';
  SETS[idx].forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='drill-card';
    card.dataset.q=i;
    card.innerHTML=`<div class="q-num">問 ${i+1}</div><div class="q-text">${q.q}</div><div class="choices">${q.choices.map((c,j)=>`<button class="choice" data-i="${j}" onclick="pick(this,${i})">${c}</button>`).join('')}</div><div class="feedback" id="fb-${i}"></div>`;
    area.appendChild(card);
  });
}
function pick(btn,qIdx){const card=btn.closest('.drill-card');if(card.dataset.chosen)return;card.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');card.dataset.chosen=btn.dataset.i;}
function grade(){
  const qs=SETS[currentSet];let correct=0;
  qs.forEach((q,i)=>{
    const card=document.querySelector(`.drill-card[data-q="${i}"]`);const chosen=card.dataset.chosen;
    if(!chosen){alert(`問${i+1}がまだ選択されていません`);return;}
    const isOK=parseInt(chosen)===q.ans;if(isOK)correct++;
    card.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(parseInt(b.dataset.i)===q.ans)b.classList.add('correct');if(parseInt(b.dataset.i)===parseInt(chosen)&&!isOK)b.classList.add('wrong');});
    const fb=document.getElementById(`fb-${i}`);
    fb.innerHTML=q.exp+'<div class="fb-steps">'+q.steps.map(s=>`<div>${s}</div>`).join('')+'</div>';
    fb.className='feedback show '+(isOK?'ok-fb':'ng-fb');
  });
  const passed=correct===qs.length;const result=document.getElementById('result');
  result.className='result-box show '+(passed?'passed':'failed');
  document.getElementById('result-msg').textContent=passed?'🎉 全問正解！':'もう一度確認しましょう';
  document.getElementById('result-score').textContent=`${correct} / ${qs.length}`;
  document.getElementById('result-detail').textContent=passed?'確認テストへ進もう！':'解説を読んで別のセットにも挑戦してみよう。';
  if(passed)confetti();
  document.getElementById('btn-submit').disabled=true;document.getElementById('btn-submit').textContent='採点済み';
}
function confetti(){const colors=['#4f46e5','#f59e0b','#059669','#0284c7','#9333ea'];for(let i=0;i<60;i++){const el=document.createElement('div');el.className='confetti-piece';el.style.cssText=`left:${Math.random()*100}vw;background:${colors[i%5]};animation-delay:${Math.random()*1.2}s;animation-duration:${2+Math.random()}s;`;document.body.appendChild(el);setTimeout(()=>el.remove(),3500);}}
loadSet(0);
</script>
</body>
</html>
